# 外部配置：优先级高于 jar 内置 application.properties（永久生效）
# 修正 Mongo 认证（server.id=10001）
# 注意：core 库名必须是【不存在/空白】的库，见下方说明——指向真实 x1_cn_test_login 会因
#       MongoUtil.init() 遍历 server_info 时数据映射异常(NPE)导致主线程崩溃、服务起不来。
#
# 🔴 入库版本已脱敏：本仓是 PUBLIC 仓库，真实口令只在线上
#     /home/java/gameserver/config/application.properties 与本机 .secrets/ 中。
#     mongo 用户名/口令在密码管理器里取，切勿提交回仓库。
spring.data.mongodb.uri=mongodb://<REDACTED>@127.0.0.1:27017/m5_x1_game_10001?authSource=admin
spring.data.mongodbcore.uri=mongodb://<REDACTED>@127.0.0.1:27017/m5_x1_login?authSource=admin

# 2026-10-18 关闭 GM 调试通道（覆盖 jar 内置 true）
# 为什么必须写在这里而不是 logicSrv.properties：RESTART-GAMESERVER.sh 启动时
# 不带 --spring.config.location，logicSrv.properties 从未被加载过（改它无效）。
# 验证方式：grep -a "ServerProperties ->" /data/srvlog/gameserver.log | tail -1
#           必须看到 debug=false，光 grep 配置文件不算数。
server.debug=false
